<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iceberg — миграция global_ids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0F1E;
            color: #FFF;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: #0F1A2A;
            border: 1px solid #2A3A4A;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #64B5F6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #88A9C4;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #64B5F6, #1E88E5);
            color: white;
            margin-bottom: 10px;
            transition: all .2s;
            font-family: inherit;
        }
        .btn:hover:not(:disabled) { filter: brightness(1.1); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn.secondary {
            background: transparent;
            border: 1px solid #2A3A4A;
            color: #64B5F6;
        }
        .btn.danger {
            background: linear-gradient(135deg, #E53935, #c62828);
        }
        .log {
            background: #000;
            color: #aaffaa;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 340px;
            overflow-y: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log .error { color: #ff6666; }
        .log .success { color: #66ff88; }
        .log .warn { color: #ffbb33; }
        .log .info { color: #88ccff; }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 14px 0;
        }
        .stat {
            background: #1A2A3A;
            padding: 12px 8px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #64B5F6;
        }
        .stat-label {
            font-size: 10px;
            color: #88A9C4;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-top: 2px;
        }
        .auth-info {
            background: #1A2A3A;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #88A9C4;
            margin-bottom: 14px;
            word-break: break-all;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #2A3A4A;
            border-radius: 10px;
            background: #0A0F1E;
            color: #FFF;
            font-size: 14px;
            margin-bottom: 10px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #64B5F6;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1A2A3A;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #64B5F6, #a78bfa);
            width: 0%;
            transition: width .3s;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 Миграция global_ids</h1>
        <div class="subtitle">Перенос users → global_ids для входа по Global ID</div>

        <!-- Экран логина -->
        <div id="loginScreen">
            <div class="auth-info">
                Войди под своим аккаунтом — скрипту нужны права на запись в <b>global_ids</b>.
            </div>
            <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
            <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
            <button class="btn" onclick="doLogin()">Войти</button>
            <div id="loginMessage" style="text-align:center;font-size:13px;margin-top:10px;"></div>
        </div>

        <!-- Экран миграции -->
        <div id="migrateScreen" style="display:none;">
            <div class="auth-info">
                Залогинен как: <b id="authEmail">—</b><br>
                UID: <span id="authUid" style="font-size:11px;">—</span>
            </div>

            <div class="stats">
                <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Всего</div></div>
                <div class="stat"><div class="stat-value" id="statOk" style="color:#4CAF50;">0</div><div class="stat-label">Создано</div></div>
                <div class="stat"><div class="stat-value" id="statSkip" style="color:#FF9800;">0</div><div class="stat-label">Пропущено</div></div>
                <div class="stat"><div class="stat-value" id="statErr" style="color:#E53935;">0</div><div class="stat-label">Ошибки</div></div>
            </div>

            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

            <button class="btn" id="startBtn" onclick="startMigration()">🚀 Начать перенос</button>
            <button class="btn secondary" id="dryBtn" onclick="startMigration(true)" disabled>🔍 Только проверить (без записи)</button>
            <button class="btn secondary" onclick="clearLog()">🧹 Очистить лог</button>
            <button class="btn danger" onclick="doLogout()">🚪 Выйти</button>

            <div class="log" id="log"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore, collection, getDocs, doc, setDoc, getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6GGJxAiao77U7_9mBUEjftmS_FnSWbIw",
            authDomain: "glob-data.firebaseapp.com",
            projectId: "glob-data",
            storageBucket: "glob-data.firebasestorage.app",
            messagingSenderId: "122757049174",
            appId: "1:122757049174:web:ebb425edd0e1a8ea9a44f7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();

        // ==================== ЛОГГЕР ====================
        const logEl = document.getElementById('log');
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const prefix = {
                info: '[i]',
                success: '[+]',
                error: '[!]',
                warn: '[~]'
            }[type] || '[i]';
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `${time} ${prefix} ${msg}`;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }
        function clearLog() { logEl.innerHTML = ''; }

        // ==================== АВТОРИЗАЦИЯ ====================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('migrateScreen').style.display = 'block';
                document.getElementById('authEmail').textContent = user.email;
                document.getElementById('authUid').textContent = user.uid;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('dryBtn').disabled = false;
                log('Авторизация успешна: ' + user.email, 'success');
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('migrateScreen').style.display = 'none';
            }
        });

        window.doLogin = async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pw = document.getElementById('loginPassword').value;
            const msg = document.getElementById('loginMessage');
            if (!email || !pw) {
                msg.textContent = 'Заполни поля';
                msg.style.color = '#E53935';
                return;
            }
            msg.textContent = 'Вход...';
            msg.style.color = '#88A9C4';
            try {
                await signInWithEmailAndPassword(auth, email, pw);
                msg.textContent = '';
            } catch (e) {
                msg.textContent = 'Ошибка: ' + (e.code || e.message);
                msg.style.color = '#E53935';
            }
        };

        window.doLogout = async () => {
            if (!confirm('Выйти из аккаунта?')) return;
            await signOut(auth);
            clearLog();
        };

        // ==================== МИГРАЦИЯ ====================
        let total = 0, ok = 0, skip = 0, err = 0;
        let running = false;

        function updateStats() {
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statOk').textContent = ok;
            document.getElementById('statSkip').textContent = skip;
            document.getElementById('statErr').textContent = err;
            const pct = total > 0 ? Math.round(((ok + skip + err) / total) * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
        }

        window.startMigration = async (dryRun = false) => {
            if (running) return;
            running = true;
            total = ok = skip = err = 0;
            updateStats();

            const startBtn = document.getElementById('startBtn');
            const dryBtn = document.getElementById('dryBtn');
            startBtn.disabled = true;
            dryBtn.disabled = true;

            if (dryRun) log('=== РЕЖИМ ПРОВЕРКИ (без записи) ===', 'warn');
            else log('=== НАЧАЛО ПЕРЕНОСА ===', 'info');

            try {
                // Читаем всех пользователей
                log('Читаю коллекцию users...', 'info');
                const usersSnap = await getDocs(collection(db, 'users'));
                total = usersSnap.size;
                updateStats();
                log(`Найдено пользователей: ${total}`, 'info');

                if (total === 0) {
                    log('Нет пользователей для переноса.', 'warn');
                    running = false;
                    startBtn.disabled = false;
                    dryBtn.disabled = false;
                    return;
                }

                // Проходим по каждому
                let i = 0;
                for (const userDoc of usersSnap.docs) {
                    i++;
                    const uid = userDoc.id;
                    const data = userDoc.data();
                    const globalId = (data.globalId || '').trim();
                    const email = (data.email || '').trim();

                    // Валидация
                    if (!globalId) {
                        log(`[${i}/${total}] ${uid} — нет globalId, пропуск`, 'warn');
                        skip++;
                        updateStats();
                        continue;
                    }
                    if (!email) {
                        log(`[${i}/${total}] ${uid} — нет email, пропуск`, 'warn');
                        skip++;
                        updateStats();
                        continue;
                    }

                    // Проверяем, есть ли уже запись в global_ids
                    try {
                        const existing = await getDoc(doc(db, 'global_ids', globalId));
                        if (existing.exists()) {
                            const exData = existing.data();
                            if (exData.uid === uid && exData.email === email) {
                                log(`[${i}/${total}] ${globalId} — уже актуален, пропуск`, 'info');
                                skip++;
                                updateStats();
                                continue;
                            } else {
                                log(`[${i}/${total}] ${globalId} — перезапись (uid/email изменились)`, 'warn');
                            }
                        }
                    } catch (e) {
                        // Игнор — просто попробуем создать
                    }

                    // Записываем (или симулируем)
                    if (dryRun) {
                        log(`[${i}/${total}] ${globalId} → ${email} (симуляция)`, 'info');
                        ok++;
                    } else {
                        try {
                            await setDoc(doc(db, 'global_ids', globalId), {
                                uid: uid,
                                email: email,
                                createdAt: new Date()
                            });
                            log(`[${i}/${total}] ${globalId} → ${email} ✓`, 'success');
                            ok++;
                        } catch (e) {
                            log(`[${i}/${total}] ${globalId} — ОШИБКА: ${e.message}`, 'error');
                            err++;
                        }
                    }
                    updateStats();

                    // Небольшая пауза, чтобы не долбить Firestore
                    await new Promise(r => setTimeout(r, 30));
                }

                log('=== ГОТОВО ===', 'success');
                log(`Всего: ${total} | Создано: ${ok} | Пропущено: ${skip} | Ошибок: ${err}`, 'info');

                if (dryRun) {
                    log('Это была симуляция. Реальные данные НЕ изменены.', 'warn');
                } else if (err === 0) {
                    log('🎉 Все пользователи перенесены успешно!', 'success');
                } else {
                    log(`⚠️ ${err} ошибок — проверь лог выше.`, 'warn');
                }

                // Проверка результата
                if (!dryRun && ok > 0) {
                    log('Проверяю коллекцию global_ids...', 'info');
                    const checkSnap = await getDocs(collection(db, 'global_ids'));
                    log(`Теперь в global_ids: ${checkSnap.size} документов`, 'success');
                }

            } catch (e) {
                log('КРИТИЧЕСКАЯ ОШИБКА: ' + e.message, 'error');
                console.error(e);
            } finally {
                running = false;
                startBtn.disabled = false;
                dryBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
